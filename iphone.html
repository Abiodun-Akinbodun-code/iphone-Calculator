<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(255, 255, 255);
        }
        .iphone{
            width: 370px;
            margin-top: 100px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 15px #000;
            background-color: rgb(51, 51, 51);
        }
        #display{
            width: 100%;
            height: 100px;
            font: 2rem sans-serif;
            text-align: right;
            padding-right: 10px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .buttons{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .btn{
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 100%;
            height: 70px;
            width: 70px;
            background-color: rgb(206, 199, 199);
            transition: 0.3s;
        }
        .operator{
            background-color: rgb(182, 120, 5);
        }
        .case{
            background-color: rgb(48, 91, 107);
        }
        .btn:hover{
            background-color:  rgb(161, 154, 154);
        }
        .operator:hover{
            background-color:  rgb(131, 91, 17);
        }
        .case:hover{
            background-color: rgb(56, 115, 136);
        }
    </style>
</head>
<body>
    <div class="iphone">
        <input type="text" id="display" placeholder="0">

       <div class="buttons">

         <button class="btn case" onclick="clearDisplay('')">C</button>
         <button class="btn case" onclick="squareRoot('')">√</button>
         <button class="btn case" onclick="square()">²</button>
         <button class="btn operator" onclick="deleteLast('')">DEL</button>

         <button class="btn" onclick="appendValue('7')">7</button>
         <button class="btn" onclick="appendValue('8')">8</button>
         <button class="btn" onclick="appendValue('9')">9</button>
         <button class="btn operator" onclick="appendValue('+')">+</button>


         <button class="btn" onclick="appendValue('4')">4</button>
         <button class="btn" onclick="appendValue('5')">5</button>
         <button class="btn" onclick="appendValue('6')">6</button>
         <button class="btn operator" onclick="appendValue('*')" style="font-size: xx-large;">*</button>


         <button class="btn" onclick="appendValue('1')">1</button>
         <button class="btn" onclick="appendValue('2')">2</button>
         <button class="btn" onclick="appendValue('3')">3</button>
         <button class="btn operator" onclick="appendValue('-')">-</button>


         <button class="btn" onclick="appendValue('0')">0</button>
         <button class="btn" onclick="appendValue('.')">.</button>
         <button class="btn" onclick="percentage('%')">%</button>
         <button class="btn operator" onclick="calculate()">=</button>
       </div>
    </div>


    <script>
        let display = document.getElementById("display")
        
        function appendValue (value){
            display.value += value;
        }
        function clearDisplay(){
            display.value = "";
        }

        function deleteLast(){
            display.value = display.value.slice(0, -1);
        }
        function squareRoot(){
            if(display.value !== ""){
                display.value = Math.sqrt(display.value);
            }
            else{
                display.value = "Error";
            }
        }
        function percentage(){
            if(display.value !== ""){
                display.value = display.value / 100;
            }
            else{
                display.value = "Error";
            }
        }
        function square(){
            if ( display.value !== ""){
                display.value = display.value ** 2;
            }
            else{
                display.value = "Error";
            }
        }
        function calculate(){
            try{
                display.value = eval(display.value);
            }
            catch {
                display.value ="Error";
            }
        }
    </script>
</body>
</html>
